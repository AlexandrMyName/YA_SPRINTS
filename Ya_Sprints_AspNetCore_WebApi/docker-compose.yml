services:
  # ============================================================
  # Kafka + Zookeeper (legacy-режим)
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sprints_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sprints_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"    # ← ВАЖНО: включено
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # Три базы данных — по одной на сервис
  # ============================================================
  postgres-users:
    image: postgres:15
    container_name: sprints_users_db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_users
    ports:
      - "5432:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-events:
    image: postgres:15
    container_name: sprints_events_db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_events
    ports:
      - "5433:5432"
    volumes:
      - events_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bookings:
    image: postgres:15
    container_name: sprints_bookings_db
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_bookings
    ports:
      - "5434:5432"
    volumes:
      - bookings_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_bookings"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Три микросервиса
  # ============================================================
  users-service:
    build:
      context: ./src                                                  # ← путь к src/
      dockerfile: Services/Users/Sprints.Users.Api/Dockerfile         # ← от src/
    image: sprints-users-api:latest
    container_name: sprints_users_service
    depends_on:
      postgres-users:
        condition: service_healthy
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-users;Port=5432;Database=sprints_users;Username=postgres;Password=postgres"
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
    restart: unless-stopped

  events-service:
    build:
      context: ./src
      dockerfile: Services/Events/Sprints.Events.Api/Dockerfile
    image: sprints-events-api:latest
    container_name: sprints_events_service
    depends_on:
      postgres-events:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-events;Port=5432;Database=sprints_events;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: sprints-events-consumer
      Kafka__Topic: booking-confirmed
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
    restart: unless-stopped

  bookings-service:
    build:
      context: ./src
      dockerfile: Services/Bookings/Sprints.Bookings.Api/Dockerfile
    image: sprints-bookings-api:latest
    container_name: sprints_bookings_service
    depends_on:
      postgres-bookings:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-bookings;Port=5432;Database=sprints_bookings;Username=postgres;Password=postgres"
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: booking-confirmed
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
    restart: unless-stopped

  # ============================================================
  # RabbitMQ (на будущее)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sprints_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  users_db_data:
  events_db_data:
  bookings_db_data:
  rabbitmq_data: