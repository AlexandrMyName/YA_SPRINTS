services:
  # ============================================================
  # Автогенерация JWT-ключей (один раз при первом запуске)
  # ============================================================
  jwt-keys-init:
    image: alpine:3.19
    container_name: sprints_jwt_keys_init
    volumes:
      - jwt_keys:/keys
    command: >
      sh -c "
        if [ -f /keys/private.pem ] && [ -f /keys/public.pem ]; then
          echo '[jwt-keys] keys already exist — skip';
          exit 0;
        fi;
        echo '[jwt-keys] generating RSA keys...';
        apk add --no-cache openssl >/dev/null 2>&1;
        mkdir -p /keys;
        openssl genrsa -out /keys/private.pem 2048;
        openssl rsa -in /keys/private.pem -pubout -out /keys/public.pem;
        chmod 644 /keys/private.pem /keys/public.pem;
        chmod 755 /keys;
        echo '[jwt-keys] done';
      "
    restart: "no"

  # ============================================================
  # Zookeeper + Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============================================================
  # Redis (кеш EventsService)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sprints_redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Три базы данных
  # ============================================================
  postgres-users:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_users
    ports:
      - "5432:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-events:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_events
    ports:
      - "5433:5432"
    volumes:
      - events_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_events"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bookings:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sprints_bookings
    ports:
      - "5434:5432"
    volumes:
      - bookings_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sprints_bookings"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Три микросервиса
  # ============================================================
  users-service:
    build:
      context: .
      dockerfile: Sprints.Users.Api/Dockerfile
    depends_on:
      postgres-users:
        condition: service_healthy
      jwt-keys-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "5001:8080"
    volumes:
      - jwt_keys:/app/keys:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-users;Port=5432;Database=sprints_users;Username=postgres;Password=postgres;SslMode=Disable"
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
      Jwt__PrivateKeyPath: "keys/private.pem"
      Jwt__PublicKeyPath: "keys/public.pem"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    restart: unless-stopped

  events-service:
    build:
      context: .
      dockerfile: Sprints.Events.Api/Dockerfile
    depends_on:
      postgres-events:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jwt-keys-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "5002:8080"
    volumes:
      - jwt_keys:/app/keys:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-events;Port=5432;Database=sprints_events;Username=postgres;Password=postgres;SslMode=Disable"
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: sprints-events-consumer
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
      Jwt__PublicKeyPath: "keys/public.pem"
      Redis__Enabled: "true"
      Redis__ConnectionString: "redis:6379,abortConnect=false,connectTimeout=2000,syncTimeout=2000"
      Redis__InstanceName: "sprints:"
      Cache__EventTtlSeconds: "300"
      Cache__TopEventsTtlSeconds: "60"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    restart: unless-stopped

  bookings-service:
    build:
      context: .
      dockerfile: Sprints.Bookings.Api/Dockerfile
    depends_on:
      postgres-bookings:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jwt-keys-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "5003:8080"
    volumes:
      - jwt_keys:/app/keys:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres-bookings;Port=5432;Database=sprints_bookings;Username=postgres;Password=postgres;SslMode=Disable"
      Kafka__BootstrapServers: kafka:29092
      Kafka__ConsumerGroup: sprints-bookings
      Jwt__Mode: HS256
      Jwt__HsKey: "SHARED_SECRET_KEY_AT_LEAST_32_CHARS_LONG_123"
      Jwt__Issuer: Sprints.Users
      Jwt__Audience: Sprints.Clients
      Jwt__PublicKeyPath: "keys/public.pem"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    restart: unless-stopped

  # ============================================================
  # EXPORTERS (Инфраструктура)
  # ============================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml
    ports:
      - "9115:9115"
    restart: unless-stopped

  # ============================================================
  # OBSERVABILITY STACKё
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: sprints_otel_collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml
    ports:
      - "4317:4317"   
      - "4318:4318"
      - "8889:8889"
    depends_on:
      jaeger:
        condition: service_started
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: sprints_jaeger
    ports:
      - "16686:16686"  
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sprints_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=exemplar-storage'
    restart: unless-stopped

  # --- Логи ---
  loki:
    image: grafana/loki:latest
    container_name: sprints_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: sprints_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # --- Визуализация ---
  grafana:
    image: grafana/grafana:latest
    container_name: sprints_grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  users_db_data:
  events_db_data:
  bookings_db_data:
  jwt_keys:
  redis_data:
  prometheus_data:  
  grafana_data: